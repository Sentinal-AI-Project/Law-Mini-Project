name: CI/CD Pipeline to AWS

on:
  push:
    branches:
      - main
      - Somesh
  pull_request:
    branches:
      - main
      - Somesh

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build frontend
        run: |
          cd frontendf
          npm install
          npm run build
      
      - name: Prepare deployment bundle
        run: |
          # Create a bundle of only what we need (No node_modules!)
          tar -czf deploy.tar.gz \
            src/ \
            AI/ \
            frontendf/dist/ \
            frontendf/Dockerfile \
            frontendf/nginx.conf \
            package.json \
            docker-compose.yml \
            Dockerfile.backend \
            Dockerfile.ai \
            requirements.txt \
            app.py \
            .env.example
          
          echo "Deployment bundle created:"
          ls -lh deploy.tar.gz

      - name: Create target directory on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USER }}
          key: ${{ secrets.AWS_EC2_PRIVATE_KEY }}
          script: mkdir -p $HOME/app

      - name: Copy bundle to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USER }}
          key: ${{ secrets.AWS_EC2_PRIVATE_KEY }}
          source: "deploy.tar.gz"
          target: "app/"
          timeout: 5m
          command_timeout: 10m
          rm: false

      - name: Execute deployment commands on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USER }}
          key: ${{ secrets.AWS_EC2_PRIVATE_KEY }}
          command_timeout: 60m
          script: |
            cd $HOME/app
            
            # Extract bundle and clean up
            if [ -f deploy.tar.gz ]; then
              tar -xzf deploy.tar.gz
              rm deploy.tar.gz
            else
              echo "Error: deploy.tar.gz not found in $(pwd)"
              exit 1
            fi

            # Create .env file
            echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
            echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> .env
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
            echo "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" >> .env

            # Setup swap for stability
            if [ ! -f /swapfile ]; then
              sudo fallocate -l 2G /swapfile
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
            fi
            sudo swapon /swapfile 2>/dev/null || true

            # Prune old images to save space
            docker system prune -af --volumes 2>/dev/null || true

            # Sequential Build (saves RAM)
            docker compose build ai --no-cache
            docker compose build backend --no-cache
            docker compose build frontend --no-cache
            
            # Restart all
            docker compose up -d --force-recreate
