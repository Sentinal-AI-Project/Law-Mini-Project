name: CI/CD Pipeline to AWS

on:
  push:
    branches:
      - main
      - Somesh
  pull_request:
    branches:
      - main
      - Somesh

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Build frontend in CI (GitHub runner has 7GB RAM, EC2 only has 460MB)
      - name: Build frontend
        run: |
          cd frontendf
          npm install
          npm run build

      # Copy entire repo (including built frontend dist/) to EC2
      - name: Copy files to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USER }}
          key: ${{ secrets.AWS_EC2_PRIVATE_KEY }}
          source: "./"
          target: "~/app/"

      - name: Execute deployment commands on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USER }}
          key: ${{ secrets.AWS_EC2_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            cd ~/app

            # Create .env file with secrets for backend
            echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
            echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> .env
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env

            # Setup swap if not already present (needed for Docker builds on small instances)
            if [ ! -f /swapfile ]; then
              sudo fallocate -l 2G /swapfile
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
            fi
            sudo swapon /swapfile 2>/dev/null || true

            # Clean up old Docker artifacts to free disk space
            docker system prune -af 2>/dev/null || true

            # Restart services
            docker compose down
            docker compose build
            docker compose up -d
