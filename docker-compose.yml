version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - NLP_SERVICE_URL=http://ai:5001
      - CLIENT_URL=http://localhost:5173
    depends_on:
      - ai

  ai:
    build:
      context: .
      dockerfile: Dockerfile.ai
    ports:
      - "5001:5001"
    environment:
      - PORT=5001

  frontend:
    build:
      context: ./frontendf
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
